# Optional local CPU GGUF inference: place model at data/models/llm/model.gguf
# Launch: docker compose -f compose.yaml -f compose.llm.yaml --profile llm up -d llm
# Base worker connects to http://llm:8080/v1 after LLM is enabled in Settings.
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: [llm]
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "4096"]
    volumes:
      - ./data/models/llm:/models:ro
    networks: [default]
    restart: unless-stopped
    mem_limit: 12g
    cpus: 6
