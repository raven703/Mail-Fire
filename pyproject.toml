[project]
name = "mice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosmtpd>=1.4.6",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "clamd>=1.0.2",
    "celery==5.7.0",
    "Django==5.2.19",
    "extract-msg>=0.58.2",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "oletools>=0.60.2",
    "onnxruntime>=1.32.0",
    "openpyxl>=3.1.5",
    "paddleocr==2.10.0",
    "paddlepaddle>=3.3.1",
    "pillow>=13.0.0",
    "presidio-analyzer>=2.2.366",
    "pgvector==0.4.2",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "python-pptx>=1.0.2",
    "rapidocr>=3.10.0",
    "razdel>=0.5.0",
    "pymorphy3>=2.0.2",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "yara-python>=4.5.4",
]

[project.optional-dependencies]
ml-neural = [
    "torch>=2.4",
    "transformers>=4.46",
    "setfit>=1.1",
    "datasets>=3.0",
    "accelerate>=1.0",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
