[project]
name = "mail-fire"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosmtpd>=1.4.6",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "extract-msg>=0.58.2",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
