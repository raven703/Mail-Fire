<nav class="pagination" aria-label="Страницы"><span>Всего: {{ page.paginator.count }}</span>{% if page.has_previous %}<a href="?{{ pagination_query }}&amp;page={{ page.previous_page_number }}">Назад</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{{ pagination_query }}&amp;page={{ page.next_page_number }}">Далее</a>{% endif %}</nav>
