<label>Вложения<select name="attachments"><option value="">Все</option><option value="yes"{% if request.GET.attachments == 'yes' %} selected{% endif %}>С вложениями</option><option value="no"{% if request.GET.attachments == 'no' %} selected{% endif %}>Без вложений</option></select></label><label>Инциденты<select name="incidents"><option value="">Все</option><option value="yes"{% if request.GET.incidents == 'yes' %} selected{% endif %}>С инцидентами</option><option value="no"{% if request.GET.incidents == 'no' %} selected{% endif %}>Без инцидентов</option></select></label><label>Тип вложения<input name="mime" value="{{ request.GET.mime }}" placeholder="pdf, image…"></label><label>Критичность<select name="severity"><option value="">Все</option><option value="high"{% if request.GET.severity == 'high' %} selected{% endif %}>Высокая</option><option value="medium"{% if request.GET.severity == 'medium' %} selected{% endif %}>Средняя</option><option value="low"{% if request.GET.severity == 'low' %} selected{% endif %}>Низкая</option></select></label><label>Сортировка<select name="sort"><option value="date">По дате</option><option value="risk"{% if request.GET.sort == 'risk' %} selected{% endif %}>По критичности</option>{% if perms.identity.view_originals %}<option value="subject"{% if request.GET.sort == 'subject' %} selected{% endif %}>По теме</option>{% endif %}{% if perms.identity.view_originals %}<option value="sender"{% if request.GET.sort == 'sender' %} selected{% endif %}>По отправителю</option>{% endif %}</select></label><label>Порядок<select name="order"><option value="desc">По убыванию</option><option value="asc"{% if request.GET.order == 'asc' %} selected{% endif %}>По возрастанию</option></select></label><a href="{% url 'messages-page' %}">Сбросить фильтры</a>
