<label>Вложения<select name="attachments"><option value="">Все</option><option value="yes"{% if request.GET.attachments == 'yes' %} selected{% endif %}>С вложениями</option><option value="no"{% if request.GET.attachments == 'no' %} selected{% endif %}>Без вложений</option></select></label><label>Инциденты<select name="incidents"><option value="">Все</option><option value="yes"{% if request.GET.incidents == 'yes' %} selected{% endif %}>С инцидентами</option><option value="no"{% if request.GET.incidents == 'no' %} selected{% endif %}>Без инцидентов</option></select></label><label>Тип вложения<input name="mime" value="{{ request.GET.mime }}" placeholder="pdf, image…"></label><label>Сортировка<select name="sort"><option value="date">По дате</option>{% if perms.identity.view_originals %}<option value="sender"{% if request.GET.sort == 'sender' %} selected{% endif %}>По отправителю</option>{% endif %}</select></label><label>Порядок<select name="order"><option value="desc">По убыванию</option><option value="asc"{% if request.GET.order == 'asc' %} selected{% endif %}>По возрастанию</option></select></label><a href="{% url 'messages-page' %}">Сбросить фильтры</a>
