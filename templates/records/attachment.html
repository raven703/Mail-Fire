{% extends 'identity/base.html' %}
{% block body %}
<main data-standalone-viewer>
  <header><h1>{{ attachment.name }}</h1><div class="actions"><a href="{% url 'message-detail' attachment.message_id %}">Карточка письма</a><a class="action-button" href="{% url 'attachment-download' attachment.pk %}" hx-boost="false" download>↓ Скачать вложение</a></div></header>
  <div id="attachment-viewer" class="editor-dialog-layout">
    <header class="editor-dialog-header"><div class="editor-dialog-title"><h2 id="attachment-viewer-title">{{ attachment.name }}</h2><p>Локальный просмотр документа</p></div><button class="editor-dialog-close" type="button" data-viewer-close aria-label="Закрыть">×</button></header>
    <div class="editor-dialog-body">{% include 'records/_attachment_viewer.html' %}</div>
    <footer class="editor-dialog-footer"><a class="action-button" href="{% url 'attachment-download' attachment.pk %}" hx-boost="false" download>↓ Скачать вложение</a><button type="button" data-viewer-close>Закрыть</button></footer>
  </div>
</main>
{% endblock %}
