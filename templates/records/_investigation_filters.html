{% include 'records/_message_filters.html' %}
{% if perms.identity.view_originals %}<label>Отправитель<input name="sender" value="{{ request.GET.sender }}"></label><label>Получатель<input name="recipient" value="{{ request.GET.recipient }}"></label>{% endif %}
<label>Сортировка<select name="sort"><option value="date">По дате</option><option value="risk"{% if request.GET.sort == 'risk' %} selected{% endif %}>По критичности</option>{% if perms.identity.view_originals %}<option value="sender"{% if request.GET.sort == 'sender' %} selected{% endif %}>По отправителю</option>{% endif %}</select></label><label>Порядок<select name="order"><option value="desc">По убыванию</option><option value="asc"{% if request.GET.order == 'asc' %} selected{% endif %}>По возрастанию</option></select></label>{% if not hide_reset %}<a class="action-button" href="{% url 'incidents-page' %}">Сбросить фильтры</a>{% endif %}
