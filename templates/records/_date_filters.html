<div class="range" data-date-range{% if auto_period %} data-auto-period="true"{% endif %}>
  <label>Период<select name="range" data-period>
    <option value="custom">Произвольный период</option>
    <option value="24"{% if request.GET.range == '24' or default_range == '24' and not request.GET.range and not request.GET.start and not request.GET.end and not request.GET.days %} selected{% endif %}>Последние 24 часа</option>
    <option value="168"{% if request.GET.range == '168' %} selected{% endif %}>Последние 7 дней</option>
    <option value="720"{% if request.GET.range == '720' %} selected{% endif %}>Последние 30 дней</option>
  </select></label>
  <label data-custom-date>Начало<input type="datetime-local" name="start" value="{{ request.GET.start }}"></label>
  <label data-custom-date>Окончание<input type="datetime-local" name="end" value="{{ request.GET.end }}"></label>
  <input type="hidden" name="start_offset" value="{{ request.GET.start_offset }}">
  <input type="hidden" name="end_offset" value="{{ request.GET.end_offset }}">
  <small data-timezone>Время без часового пояса считается UTC</small>
</div>
