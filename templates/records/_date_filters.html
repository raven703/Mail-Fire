<div class="range" data-date-range><label>Период<select name="range" data-period><option value="custom">Произвольный период</option><option value="24"{% if request.GET.range == '24' %} selected{% endif %}>Последние 24 часа</option><option value="168"{% if request.GET.range == '168' %} selected{% endif %}>Последние 7 дней</option><option value="720"{% if request.GET.range == '720' %} selected{% endif %}>Последние 30 дней</option></select></label><label>Начало<input type="datetime-local" name="start" value="{{ request.GET.start }}"></label><label>Окончание<input type="datetime-local" name="end" value="{{ request.GET.end }}"></label><small data-timezone></small></div>
