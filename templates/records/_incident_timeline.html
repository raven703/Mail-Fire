<section class="so-panel so-trend"><header class="so-section-heading"><h2>Динамика инцидентов</h2><p>Высокий / средний / низкий риск</p></header><div class="chart" aria-label="Динамика инцидентов">{% for row in timeline %}<div class="chart-column" title="{{ row.day|date:'d.m.Y' }}: HIGH {{ row.high }}, MEDIUM {{ row.medium }}, LOW {{ row.low }}"><div class="bar">{% for segment in row.segments %}<div class="{{ segment.level }}" style="height:{{ segment.height }}px" aria-label="{{ segment.level }}: {{ segment.count }}"></div>{% endfor %}</div><small>{{ row.day|date:'d.m' }}</small></div>{% empty %}<p class="empty">За выбранный период инцидентов нет</p>{% endfor %}</div></section>
