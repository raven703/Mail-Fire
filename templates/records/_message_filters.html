<label>Направление<select name="direction"><option value="">Все</option><option value="INBOUND"{% if request.GET.direction == 'INBOUND' %} selected{% endif %}>Входящие</option><option value="OUTBOUND"{% if request.GET.direction == 'OUTBOUND' %} selected{% endif %}>Исходящие</option><option value="INTERNAL"{% if request.GET.direction == 'INTERNAL' %} selected{% endif %}>Внутренние</option><option value="UNKNOWN"{% if request.GET.direction == 'UNKNOWN' %} selected{% endif %}>Не определено</option></select></label><label>Источник<select name="source"><option value="">Все</option>{% for source in sources %}<option{% if source == request.GET.source %} selected{% endif %}>{{ source }}</option>{% endfor %}</select></label>
