<label>Критичность<select name="severity"><option value="">Все</option><option value="high"{% if request.GET.severity == 'high' %} selected{% endif %}>Высокая</option><option value="medium"{% if request.GET.severity == 'medium' %} selected{% endif %}>Средняя</option><option value="low"{% if request.GET.severity == 'low' %} selected{% endif %}>Низкая</option></select></label><details><summary>Категории данных ({{ selected_categories|length }})</summary>{% for category in categories %}<label><input type="checkbox" name="category" value="{{ category.pk }}"{% if category.pk in selected_categories %} checked{% endif %}>{{ category.name }}</label>{% endfor %}</details>
