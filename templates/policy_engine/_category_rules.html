<div data-rule-formset data-rule-limit="30">
  {{ rules_form.management_form }}{{ rules_form.non_form_errors }}
  {% for rule in rules_form %}
    <details class="ui-disclosure category-rule-form"{% if rule.errors %} open{% endif %}>
      <summary>{% include 'policy_engine/_rule_summary.html' %}</summary>
      {% include 'policy_engine/_rule_editor.html' with rule=rule %}
    </details>
  {% endfor %}
  <template data-empty-rule><details class="ui-disclosure category-rule-form" open><summary>{% include 'policy_engine/_rule_summary.html' with rule=rules_form.empty_form %}</summary>{% include 'policy_engine/_rule_editor.html' with rule=rules_form.empty_form %}</details></template>
  <button type="button" data-add-rule>＋ Добавить правило</button>
</div>
