<dialog class="editor-dialog editor-dialog-wide rule-editor-dialog" data-picker-create-dialog aria-labelledby="picker-create-title">
  <form class="editor-dialog-layout" hx-post="{% url 'category-picker-add' %}" hx-target="#picker-create-slot" hx-select="unset" hx-swap="innerHTML">
    {% csrf_token %}
    <header class="editor-dialog-header"><h2 id="picker-create-title">Новая категория</h2><button type="button" class="editor-dialog-close" data-picker-create-close aria-label="Закрыть">×</button></header>
    <div class="editor-dialog-body">{% include 'policy_engine/_category_tabs.html' %}</div>
    <footer class="editor-dialog-footer"><button type="button" data-picker-create-close>Отмена</button><button class="primary">Сохранить категорию</button></footer>
  </form>
</dialog>
