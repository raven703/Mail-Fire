<dialog class="editor-dialog {{ dialog_class }}" data-editor{% if close_url %} data-close-url="{{ close_url }}"{% endif %} aria-labelledby="{{ id }}-title">
  {% if readonly %}<div class="editor-dialog-layout">{% else %}<form method="post" class="editor-dialog-layout">{% csrf_token %}{% endif %}
  <header class="editor-dialog-header"><h2 id="{{ id }}-title">{{ title }}</h2><button type="button" class="editor-dialog-close" data-dialog-close aria-label="Закрыть">×</button></header>
  <div class="editor-dialog-body">{% include content_template %}</div>
  <footer class="editor-dialog-footer">{% if readonly %}<button type="button" data-dialog-close>Закрыть</button>{% else %}<button type="button" data-dialog-close>Отмена</button><button type="submit" class="primary">{{ submit_label|default:'Сохранить' }}</button>{% endif %}</footer>
  {% if readonly %}</div>{% else %}</form>{% endif %}
</dialog>
