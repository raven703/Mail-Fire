<dialog class="editor-dialog {{ dialog_class }}" data-editor{% if close_url %} data-close-url="{{ close_url }}"{% endif %} aria-labelledby="{{ id }}-title"><form method="post" class="editor-dialog-layout">{% csrf_token %}<header class="editor-dialog-header"><h2 id="{{ id }}-title">{{ title }}</h2><button type="button" class="editor-dialog-close" data-dialog-close aria-label="Закрыть">×</button></header><div class="editor-dialog-body">{% include content_template %}</div><footer class="editor-dialog-footer"><button type="button" data-dialog-close>Отмена</button><button type="submit" class="primary">{{ submit_label|default:'Сохранить' }}</button></footer></form></dialog>
