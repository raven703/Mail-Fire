<nav class="pagination" aria-label="Страницы"><span class="pagination-summary">{% if page.paginator.count %}Показано {{ page.start_index }}–{{ page.end_index }} из {{ page.paginator.count }}{% else %}Всего: 0{% endif %}</span>{% if page.has_previous %}<a class="action-button" rel="prev" href="?{{ pagination_query }}&amp;page={{ page.previous_page_number }}">Назад</a>{% endif %}<span aria-current="page">{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="action-button" rel="next" href="?{{ pagination_query }}&amp;page={{ page.next_page_number }}">Далее</a>{% endif %}</nav>
