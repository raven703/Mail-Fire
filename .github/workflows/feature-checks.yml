name: MICE checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mice
          POSTGRES_PASSWORD: test-password-only
          POSTGRES_DB: mice
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mice" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: test-only-secret
      MICE_DB_NAME: mice
      MICE_DB_USER: mice
      MICE_DB_PASSWORD: test-password-only
      MICE_DB_PORT: '5432'
      MICE_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.django.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test identity records pipeline policy_engine --noinput

  unified-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.django-parser -t mice-unified-parser:ci .
      - name: Real sandbox and matcher checks
        run: |
          docker run --rm --init --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --cap-drop ALL --security-opt no-new-privileges:true --memory 3g --cpus 2 --pids-limit 96 \
            -v "$PWD/tests:/app/tests:ro" mice-unified-parser:ci \
            python -c 'import runpy; runpy.run_path("/app/tests/probe_unified_signal.py",run_name="__main__"); suites=[runpy.run_path("/app/tests/"+f) for f in ("test_text_match.py","test_unified_analysis.py","test_analysis_recovery.py","test_analysis_http.py")]; [(print(name, flush=True), fn()) for suite in suites for name,fn in sorted(suite.items()) if name.startswith("test_")]'
