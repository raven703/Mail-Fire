name: Mail-Fire feature checks
on:
  pull_request:
  push:
    branches:
      - feature/unified-incidents-policy-lifecycle-smart-detection

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python and migrations
        run: python -m compileall -q app migrations
      - name: Fast pure-Python matcher tests
        run: |
          python -m pip install pytest razdel pymorphy3
          pytest -q tests/test_text_match.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck and bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mailfire
          POSTGRES_PASSWORD: mailfire_test_password
          POSTGRES_DB: mailfire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailfire -d mailfire_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mailfire:mailfire_test_password@localhost:5432/mailfire_test
      MAILFIRE_TEST_DB: "1"
      ADMIN_PASSWORD: synthetic-test-password-only
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal backend test dependencies
        run: |
          python -m pip install "sqlalchemy>=2.0,<3" "psycopg[binary]>=3.2,<4" \
            "alembic>=1.14,<2" "fastapi>=0.115,<1" "httpx>=0.27,<1" \
            "pydantic-settings>=2,<3" "argon2-cffi>=23,<26" \
            "beautifulsoup4>=4.12,<5" "python-multipart>=0.0.9" "pytest>=9,<10" \
            "scikit-learn>=1.6,<2" razdel pymorphy3
      - name: Migrate and bootstrap a disposable PostgreSQL
        run: |
          alembic upgrade head
          python -m app.bootstrap
      - name: Validate unified incidents and workspace lifecycle
        run: pytest -q tests/test_unified_incidents.py tests/test_incident_reanalysis.py tests/test_workspace.py tests/test_llm_api_only.py tests/test_document_templates.py tests/test_analysis_status.py
