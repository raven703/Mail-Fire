name: MICE checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mice
          POSTGRES_PASSWORD: test-password-only
          POSTGRES_DB: mice
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mice" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: test-only-secret
      MICE_DB_NAME: mice
      MICE_DB_USER: mice
      MICE_DB_PASSWORD: test-password-only
      MICE_DB_PORT: '5432'
      MICE_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.django.lock
      - run: python manage.py check
      - run: python manage.py test identity records pipeline policy_engine --noinput
