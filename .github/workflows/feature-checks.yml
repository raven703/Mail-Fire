name: Mail-Fire feature checks
on:
  pull_request:
  push:
    branches:
      - feature/unified-incidents-policy-lifecycle-smart-detection

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python and migrations
        run: python -m compileall -q app migrations
      - name: Fast pure-Python matcher tests
        run: |
          python -m pip install pytest
          pytest -q tests/test_text_match.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck and bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
