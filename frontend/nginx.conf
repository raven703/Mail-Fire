server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'none'" always;
    location /api/ { proxy_pass http://api:8000; proxy_read_timeout 120s; }
    location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}